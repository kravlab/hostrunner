# Publishes a GitHub Release for a pushed vX.Y.Z tag (docs/specs/release.md):
# the full CI first, then GoReleaser and a build provenance attestation.
# No concurrency group here; see the note on it in ci.yml.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      # Full history: the changelog lists the commits since the previous
      # tag, and the next step needs origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only reviewed code is released: a tag on a commit that never
      # reached main (e.g. on an unmerged branch) is refused.
      - name: tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: go goreleaser
      - name: goreleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Users check an archive with
      # `gh attestation verify <archive> --repo kravlab/hostrunner`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
