# Git hooks, installed by `mise run setup` (docs/specs/pre-commit-hook.md).
# The Claude container runs the host-installed hook too, so every command
# here must work with only go and lefthook (the setup-agent task). The
# lint task in mise.toml runs the same checks on all files; keep the two
# in step.
pre-commit:
  parallel: true
  jobs:
    # Checks, never rewrites: the working-tree copy of each staged file.
    - name: gofmt
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        [ -z "$unformatted" ] || { printf 'not gofmt-formatted:\n%s\n' "$unformatted"; exit 1; }
    # The e2e tag also vets e2e/.
    - name: go vet
      glob: "*.go"
      run: go vet -tags e2e ./...
