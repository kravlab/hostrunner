# Rules for `hostrun`: which host commands the container may run.
# A command no rule matches is denied; the rule with the longest matching
# command prefix decides. See the README for the full reference.
#
# Prefer `allow` lists for flags: git has flags that make it run a command
# of your choosing (--upload-pack, --receive-pack, --exec), and a deny list
# would have to know them all.
#
# Rules restrict argv only. git also reads .git/config and hooks from the
# workspace, which the container can write. Each git rule below requires
# the devcontainer's git mounts (see devcontainer.json: .git a mount of its
# own, .git/config and .git/hooks read-only), so git runs on the host only
# while that protection is in place. That does not make git safe: a nested
# repository the container creates (`git init sub`, then `hostrun git ...`
# from sub/) has neither mount. Allowing git against a hostile agent stays
# a conscious risk of host code execution.
#
# A host command that replaces .git/config (git writes config.lock and
# renames it over) removes the container's read-only mount of it, and the
# mount check refuses git from then on. So no rule lets the container make
# host git rewrite its config: git push takes no -u/--set-upstream and runs
# with push.autoSetupRemote off.
rules:
  - command: git status
    args: any
    # The anchor gives every git rule the same requirements: a longer rule
    # does not inherit a shorter one's.
    mounts: &git-mounts
      .git: mounted
      .git/config: read-only
      .git/hooks: read-only
  - command: git rev-parse
    args: any
    mounts: *git-mounts

  - command: git fetch
    mounts: *git-mounts
    flags:
      allow: [--prune, -p, --tags, --all, --quiet, -q, --verbose, -v]
    positional:
      # remotes by name only: no URLs, scp-style addresses or local paths
      deny: ["*://*", "*@*:*", "/*", ".*", "~*", "ext::*", "file:*"]

  - command: git pull
    mounts: *git-mounts
    flags:
      allow: [--ff-only, --rebase, -r, --no-rebase, --prune, -p, --tags, --quiet, -q, --verbose, -v]
    positional:
      deny: ["*://*", "*@*:*", "/*", ".*", "~*", "ext::*", "file:*"]

  - command: git push
    mounts: *git-mounts
    inject:
      program_args: [-c, push.autoSetupRemote=false]
    flags:
      allow: [--tags, --follow-tags, --dry-run, -n, --quiet, -q, --verbose, -v]
    positional:
      # force refspecs (+ref), deletions (:ref), and remotes other than by name
      deny: ["+*", ":*", "*://*", "*@*:*", "/*", ".*", "~*", "ext::*", "file:*"]

  # A token only the host holds, added on the host to one API call: the
  # container never sees it. A rule with secrets takes allow lists only.
  # - command: curl
  #   secrets:
  #     token: { command: [authtool, print-token], timeout: 10s }
  #   inject:
  #     command_args: ["-H", "Authorization: Bearer ${token}"]
  #   flags:
  #     allow: [-s, --fail]
  #     values:
  #       -X: { allow: [GET, PUT] }
  #   positional:
  #     allow_regex: ['^https://api\.example\.com/v1/items/42$']
