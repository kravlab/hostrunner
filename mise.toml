# Toolchain and tasks for hostrunner.
#   mise run setup      # the pinned tools below, without gh, goreleaser and bats, and the git hook
#   mise run setup-dev  # the same plus gh and bats
#   mise run setup-agent  # go, lefthook and bats, for the agent's devcontainer
#   mise run <task>     # build, install, fmt, lint, test, test-scripts, check, pre-commit, e2e, release
#   mise run dc -- <cmd>, dc-task -- <task>, dev, agent  # in a devcontainer
#   mise run dev-recreate, agent-recreate  # recreate a devcontainer
#   mise run template-update  # take the devcontainer template's latest version
#     (these seven, and a cooldown for new releases, are in
#     .config/mise/conf.d/devcontainer.toml, which mise reads by itself and
#     which comes from the devcontainer template:
#     docs/specs/devcontainer-template.md)
# Docker and/or Podman come from the system; mise does not manage them.

[settings]
# Tasks install tools explicitly; otherwise `mise run` would install
# every tool below (gh included) before any task.
task.run_auto_install = false

[tools]
go = "1.27.1"
node = "26.8.2"                      # runs the devcontainer CLI (e2e only)
"npm:@devcontainers/cli" = "0.89.0"  # e2e brings up examples/devcontainer with it
gh = "2.101.0"                       # optional: only `mise run setup-dev` installs it
lefthook = "2.1.14"                  # runs the pre-commit hook (lefthook.yml)
goreleaser = "2.18.2"                # builds releases (.goreleaser.yaml); CI installs it
bats = "1.14.0"                      # tests scripts/; only setup-dev and setup-agent install it

[tasks.setup]
description = "Install the toolchain without gh, goreleaser and bats, and the pre-commit hook"
# mise exec: the task's PATH predates the lefthook just installed.
run = """
mise install go node npm:@devcontainers/cli lefthook
mise exec -- lefthook install
"""

[tasks.setup-dev]
description = "Install the toolchain, gh and bats"
depends = ["setup"]
run = "mise install gh bats"

[tasks.setup-agent]
description = "Install go, lefthook and bats, for the agent's devcontainer"
# The agent builds and tests; e2e (node, devcontainer CLI) runs on the
# host, and gh reaches the host's through hostrun. lefthook runs the
# host-installed pre-commit hook, which the container mounts read-only
# with .git/hooks, so it is not installed here.
run = "mise install go lefthook bats"

[tasks.build]
description = "Build hostrunner and the hostrun client into bin/"
# No cgo: the hostrun client is copied into containers with arbitrary
# images, so it must be statically linked (`hostrunner up` refuses a
# dynamic one).
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/ ./cmd/..."

[tasks.install]
description = "Install both binaries into the versioned layout under $PREFIX (default ~/.local)"
depends = ["build"]
# The layout `hostrunner update` needs (docs/specs/update.md): a directory
# per version, a current link switched with one rename, and absolute bin/
# symlinks through it. It runs under the lock `update` takes (a flock on
# the root). The current link first points to one synced copy while a
# second one replaces <version>, so it always names an existing complete
# pair, a reinstalled version included. Temporary entries start with
# .tmp., in the root and in bin/; a run that fails or is killed leaves
# them, and the next one removes them under the lock, except one the
# current link names (left by a killed install). Only directories named
# dev or a semver version (is_version, as golang.org/x/mod/semver reads
# one) are version directories; other entries of the root are kept. The
# built version is installed whatever it is: unlike update, this can
# downgrade. Commands chain with && whatever shell options mise runs the
# script with.
run = """
prefix="${PREFIX:-$HOME/.local}" &&
case "$prefix" in /*) ;; *) prefix="$PWD/$prefix" ;; esac &&
root="$prefix/lib/hostrunner" &&
version="$(bin/hostrunner version)" &&
install -d "$root" "$prefix/bin" &&
exec 9<"$root" &&
{ flock -n 9 || { rc=$? && if [ "$rc" = 1 ]; then echo "another update or install is running in $root" >&2; else echo "cannot lock $root (flock exit $rc)" >&2; fi && false; }; } &&
{ old="$(readlink "$root/current")" || old=; } &&
for entry in "$root"/.tmp.*; do { [ ! -e "$entry" ] && [ ! -L "$entry" ]; } || [ "${entry##*/}" = "$old" ] || rm -rf "$entry" || exit; done &&
rm -f "$prefix/bin"/.tmp.hostrunner-* "$prefix/bin"/.tmp.hostrun-* &&
n='(0|[1-9][0-9]*)' && p='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)' && b='[0-9A-Za-z-]+' &&
is_version() { printf '%s\\n' "$1" | grep -Eqx "v$n(\\.$n(\\.$n(-$p(\\.$p)*)?(\\+$b(\\.$b)*)?)?)?"; } &&
copy() { dir="$(mktemp -d "$root/.tmp.$version-XXXXXXXX")" && chmod 0755 "$dir" && install -m 0755 bin/hostrunner bin/hostrun "$dir/" && sync "$dir/hostrunner" "$dir/hostrun" "$dir" "$root"; } &&
relink() { link="$(mktemp -u "$(dirname "$2")/.tmp.$(basename "$2")-XXXXXXXX")" && ln -s "$1" "$link" && mv -T "$link" "$2"; } &&
switch() { relink "$1" "$root/current" && sync "$root"; } &&
copy && first="$dir" && switch "${first##*/}" &&
copy && rm -rf "$root/$version" && mv -T "$dir" "$root/$version" && sync "$root" &&
switch "$version" &&
for entry in "$root"/* "$root"/.tmp.*; do name="${entry##*/}" && case "$name" in "$version") continue ;; .tmp.*) ;; *) { [ -d "$entry" ] && [ ! -L "$entry" ] && { [ "$name" = dev ] || is_version "$name"; }; } || continue ;; esac && rm -rf "$entry" || exit; done &&
relink "$root/current/hostrunner" "$prefix/bin/hostrunner" &&
relink "$root/current/hostrun" "$prefix/bin/hostrun" &&
sync "$prefix/bin"
"""

[tasks.test]
description = "Unit and integration tests"
run = "go test -race ./..."

[tasks.test-scripts]
description = "Test the shell scripts in scripts/ (bats)"
run = "bats scripts/"

# fmt and lint cover the same files (.), so whatever lint's gofmt check
# reports, fmt fixes (go vet findings need code changes).
[tasks.fmt]
description = "Format the Go files (gofmt -w)"
run = "gofmt -w ."

[tasks.lint]
description = "Check gofmt formatting and go vet, without rewriting"
# The e2e tag also vets e2e/. lefthook.yml runs the same checks on commit
# (gofmt on the staged files only, go vet on the module); keep the two in
# step.
run = [
  'unformatted="$(gofmt -l .)"; [ -z "$unformatted" ] || { printf "not gofmt-formatted:\n%s\n" "$unformatted"; exit 1; }',
  "go vet -tags e2e ./...",
]

[tasks.check]
description = "Run lint and test: the quick check before a pull request"
depends = ["lint", "test"]

[tasks.pre-commit]
description = "Run the pre-commit hook's jobs on the staged files (-- --all-files: on all)"
run = "lefthook run pre-commit"

[tasks.e2e]
description = "Bring up examples/devcontainer on docker (HOSTRUNNER_E2E_PODMAN=1: also podman)"
run = "go test -tags e2e -count=1 -v ./e2e/"

[tasks.release]
description = "Tag a chosen commit of origin/main and push the tag: mise run release -- [-n N] <version>"
# raw: the script prompts for the commit and a confirmation on the
# terminal. Arguments are appended, shell-quoted, as in dc
# (.config/mise/conf.d/devcontainer.toml).
raw = true
run = "scripts/release.sh"
