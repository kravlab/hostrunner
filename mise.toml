# Toolchain and tasks for hostrunner.
#   mise run setup      # the pinned tools below, without gh
#   mise run setup-dev  # the same plus gh
#   mise run setup-agent  # go only, for the agent's devcontainer
#   mise run <task>     # build, install, test, e2e, dev, agent
# Docker and/or Podman come from the system; mise does not manage them.

[settings]
# Tasks install tools explicitly; otherwise `mise run` would install
# every tool below (gh included) before any task.
task.run_auto_install = false

[tools]
go = "1.27.1"
node = "26.8.2"                      # runs the devcontainer CLI (e2e only)
"npm:@devcontainers/cli" = "0.89.0"  # e2e brings up examples/devcontainer with it
gh = "2.101.0"                       # optional: only `mise run setup-dev` installs it

[tasks.setup]
description = "Install the toolchain without gh"
run = "mise install go node npm:@devcontainers/cli"

[tasks.setup-dev]
description = "Install the toolchain and gh"
depends = ["setup"]
run = "mise install gh"

[tasks.setup-agent]
description = "Install go only, for the agent's devcontainer"
# The agent builds and tests; e2e (node, devcontainer CLI) runs on the
# host, and gh reaches the host's through hostrun.
run = "mise install go"

[tasks.build]
description = "Build hostrunner and the hostrun client into bin/"
# No cgo: the hostrun client is copied into containers with arbitrary
# images, so it must be statically linked (`hostrunner up` refuses a
# dynamic one).
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/ ./cmd/..."

[tasks.install]
description = "Install both binaries into $PREFIX/bin (default ~/.local/bin)"
depends = ["build"]
run = """
prefix="${PREFIX:-$HOME/.local}"
install -d "$prefix/bin"
install -m 0755 bin/hostrunner bin/hostrun "$prefix/bin/"
"""

[tasks.test]
description = "Unit and integration tests"
run = "go test -race ./..."

# The devcontainer tasks bring a container up and run bash (dev) or
# Claude Code (agent) in it; raw hands it the terminal. They need the
# devcontainer CLI (`mise run setup`); `agent` also needs hostrunner
# (`mise run install`).
[tasks.dev]
description = "Start the everyday devcontainer and open bash in it"
raw = true
run = "devcontainer up --workspace-folder . && devcontainer exec --workspace-folder . bash"

[tasks.agent]
description = "Start the Claude Code devcontainer and run claude in it"
raw = true
run = """
config=.devcontainer/claude/devcontainer.json
devcontainer up --workspace-folder . --config "$config"
devcontainer exec --workspace-folder . --config "$config" claude
"""

[tasks.e2e]
description = "Bring up examples/devcontainer on docker (HOSTRUNNER_E2E_PODMAN=1: also podman)"
run = "go test -tags e2e -count=1 -v ./e2e/"
